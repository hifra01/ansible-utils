---
# defaults file for nginx

# Global Nginx hardening and buffer parameters
nginx_server_tokens: "off"
nginx_client_max_body_size: "10m"
nginx_client_body_buffer_size: "128k"
nginx_client_header_buffer_size: "1k"
nginx_large_client_header_buffers: "4 4k"

nginx_security_headers_enabled: true

# SSL/TLS global configuration
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
nginx_ssl_prefer_server_ciphers: "on"

# Cloudflare & Trusted Proxies configuration
nginx_cloudflare_enabled: false
nginx_trusted_proxies:
  - "::1"
  - "127.0.0.1"
nginx_real_ip_header: "X-Forwarded-For"
nginx_real_ip_recursive: "on"

# Dynamic site configuration structure
nginx_sites:
  - name: default
    domains:
      - "_"
    listen: 80
    root: /var/www/html
    type: static
    index:
      - index.html
      - index.htm
    try_files: "$uri $uri/ =404"
    cloudflare_real_ip: false
    cloudflare_filter: false

  - name: app_proxy
    domains:
      - "app.example.local"
      - "www.app.example.local"
    listen: 80
    type: proxy
    proxy_pass: "http://127.0.0.1:8080"
    proxy_set_headers: true
    cloudflare_real_ip: false
    cloudflare_filter: false
    custom_headers:
      - name: "X-Proxy-By"
        value: "Ansible Nginx Role"
        always: true

  - name: php_app
    domains:
      - "php.example.local"
    listen: 80
    root: /var/www/php
    type: php
    index:
      - index.php
      - index.html
    try_files: "$uri $uri/ /index.php$is_args$args"
    fastcgi_pass: "unix:/run/php/php8.2-fpm.sock"
    cloudflare_real_ip: false
    cloudflare_filter: false

# List of site names that should be enabled on the host
nginx_enabled_sites:
  - default

# NGINX stub_status configuration (for Prometheus nginx_exporter scraping)
nginx_stub_status_enabled: false
nginx_stub_status_host: "127.0.0.1"
nginx_stub_status_port: 8080
nginx_stub_status_path: "/stub_status"
nginx_stub_status_allow:
  - "127.0.0.1"
  - "::1"
nginx_stub_status_access_log: "off"
