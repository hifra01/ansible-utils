---
# tasks file for percona_mysql

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "This role only supports Debian and RedHat family systems."

- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - percona_mysql_role in ['master', 'replica']
      - percona_mysql_server_id | int >= 1
      - percona_mysql_port | int >= 1 and percona_mysql_port | int <= 65535
      - percona_mysql_root_password | length > 0
      - (percona_mysql_role == 'master') or (percona_mysql_source_host | length == 0) or
        (percona_mysql_replication_user | length > 0 and percona_mysql_replication_password | length > 0)
    fail_msg: "Invalid percona_mysql configuration parameters. Check role, server_id, port, or replication credentials."

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Setup Percona repository
  ansible.builtin.include_tasks: "setup-{{ ansible_facts['os_family'] }}.yml"

- name: Install Percona Server for MySQL packages
  ansible.builtin.include_tasks: install.yml

- name: Configure Percona Server for MySQL
  ansible.builtin.include_tasks: configure.yml

- name: Manage application databases
  ansible.builtin.include_tasks: databases.yml
  when:
    - percona_mysql_role == 'master'
    - percona_mysql_databases | length > 0

- name: Manage application database users
  ansible.builtin.include_tasks: users.yml
  when:
    - percona_mysql_role == 'master'
    - percona_mysql_users | length > 0

- name: Configure MySQL replication
  ansible.builtin.include_tasks: replication.yml
