---

- name: Setup repository for Debian family
  when: ansible_os_family == 'Debian'
  block:
    - name: Ensure prerequisite packages are installed
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: "{{ docker_repo_url }}/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          {{ docker_repo_url }}/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: "docker-{{ docker_edition }}"
        update_cache: true

- name: Setup repository for RedHat family
  when: ansible_os_family == 'RedHat'
  block:
    - name: Ensure yum-utils is installed
      ansible.builtin.package:
        name: yum-utils
        state: present

    - name: Add Docker repository
      ansible.builtin.get_url:
        url: "{{ docker_repo_url }}/{{ docker_rhel_repo_dist }}/docker-{{ docker_edition }}.repo"
        dest: "/etc/yum.repos.d/docker-{{ docker_edition }}.repo"
        mode: "0644"
