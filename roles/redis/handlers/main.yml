---
# handlers file for redis

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "restart redis"

- name: Restart redis
  ansible.builtin.service:
    name: "{{ redis_service_name }}"
    state: restarted
  listen: "restart redis"
