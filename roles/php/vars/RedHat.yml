---
# vars file for php (RedHat family)

# EPEL and Remi packages URLs
php_remi_repo_url: "https://rpms.remirepo.net/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"

php_package_pattern: "php{{ version_nodot }}"
php_fpm_package_pattern: "php{{ version_nodot }}-php-fpm"
php_fpm_service_pattern: "php{{ version_nodot }}-php-fpm"

# Extension mapping if some extensions have special names on RedHat Remi
# e.g., mysql -> mysqlnd, zip -> pecl-zip
php_extension_map:
  mysql: "mysqlnd"
  zip: "pecl-zip"

# Pattern for extension package
php_extension_package_pattern: "php{{ version_nodot }}-php-{{ extension_mapped }}"
