---
# tasks file for consul configuration

- name: Render main Consul agent configuration
  ansible.builtin.template:
    src: consul.hcl.j2
    dest: "{{ consul_config_dir }}/consul.hcl"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0640'
  notify: "validate and restart consul"

- name: Manage extra Consul agent configuration
  ansible.builtin.copy:
    content: "{{ consul_extra_config | to_nice_json }}\n"
    dest: "{{ consul_config_dir }}/extra.json"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0640'
  when: consul_extra_config | length > 0
  notify: "validate and restart consul"

- name: Ensure extra Consul agent configuration is absent when empty
  ansible.builtin.file:
    path: "{{ consul_config_dir }}/extra.json"
    state: absent
  when: consul_extra_config | length == 0
  notify: "validate and restart consul"

- name: Ensure systemd drop-in directory exists for Consul service
  ansible.builtin.file:
    path: /etc/systemd/system/consul.service.d
    state: directory
    mode: '0755'

- name: Configure systemd service override for Consul
  ansible.builtin.copy:
    content: |
      [Service]
      Type=exec
    dest: /etc/systemd/system/consul.service.d/override.conf
    mode: '0644'
  register: _consul_systemd_override

- name: Reload systemd daemon if override changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _consul_systemd_override.changed

- name: Ensure Consul service is enabled and started
  ansible.builtin.service:
    name: "{{ consul_service_name }}"
    state: started
    enabled: true
