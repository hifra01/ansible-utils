---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: "mysql-master${MOLECULE_INSTANCE_SUFFIX:-}"
    groups:
      - mysql_master
    image: ${MOLECULE_DISTRO:-geerlingguy/docker-ubuntu2404-ansible}
    platform: linux/amd64
    command: ${MOLECULE_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  - name: "mysql-replica${MOLECULE_INSTANCE_SUFFIX:-}"
    groups:
      - mysql_replica
    image: ${MOLECULE_DISTRO:-geerlingguy/docker-ubuntu2404-ansible}
    platform: linux/amd64
    command: ${MOLECULE_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      become_method: su
  inventory:
    host_vars:
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
verifier:
  name: ansible
