---
# handlers file for nginx

- name: Validate nginx config for reload
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: "validate and reload nginx"
  notify: Reload nginx

- name: Validate nginx config for restart
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: "validate and restart nginx"
  notify: Restart nginx

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
