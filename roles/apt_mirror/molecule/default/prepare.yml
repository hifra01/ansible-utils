---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9 on RHEL/Rocky 8
      ansible.builtin.raw: |
        if [ -f /etc/redhat-release ] && grep -q 'release 8' /etc/redhat-release; then
          command -v python3.9 >/dev/null 2>&1 || dnf install -y python39
        fi
      changed_when: false

    - name: Gather facts after python bootstrap
      ansible.builtin.setup:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_distribution in ['Debian', 'Ubuntu']
