---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Python 3.9 on RHEL/Rocky 8
      ansible.builtin.raw: |
        if [ -f /etc/redhat-release ] && grep -q 'release 8' /etc/redhat-release; then
          command -v python3.9 >/dev/null 2>&1 || dnf install -y python39
        fi
      changed_when: false

    - name: Plant stale consul service fixture for purge verification
      ansible.builtin.raw: |
        mkdir -p /etc/consul.d
        echo '{"service":{"name":"stale","port":9999}}' > /etc/consul.d/service-stale.json
      changed_when: false
