---
# tasks file for consul Debian repository setup

- name: Ensure Debian prerequisite packages are installed
  ansible.builtin.apt:
    name: "{{ consul_prerequisite_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: _consul_debian_pre_pkgs
  retries: 3
  delay: 5
  until: _consul_debian_pre_pkgs is succeeded

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download HashiCorp GPG key
  ansible.builtin.get_url:
    url: "{{ consul_apt_gpg_url }}"
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: '0644'

- name: Add HashiCorp APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ consul_apt_arch }} signed-by=/etc/apt/keyrings/hashicorp.asc]
      {{ consul_apt_repo_url }}
      {{ ansible_facts['distribution_release'] }} main
    state: present
    filename: hashicorp
    update_cache: true
  register: _consul_apt_repo
  retries: 3
  delay: 5
  until: _consul_apt_repo is succeeded
