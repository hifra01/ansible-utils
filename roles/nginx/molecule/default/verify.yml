---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify Nginx package is installed
      ansible.builtin.assert:
        that:
          - "'nginx' in ansible_facts.packages"
        fail_msg: "Nginx package is not installed"

    - name: Get Nginx service status
      ansible.builtin.service_facts:

    - name: Verify Nginx service is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['nginx.service'].state == 'running'
          - ansible_facts.services['nginx.service'].status == 'enabled'
        fail_msg: "Nginx service is not running or not enabled"

    - name: Check dhparam file
      ansible.builtin.stat:
        path: /etc/nginx/dhparam.pem
      register: dhparam_file

    - name: Verify dhparam file exists
      ansible.builtin.assert:
        that:
          - dhparam_file.stat.exists

    - name: Test HTTP response from localhost
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
      register: http_test

    - name: Verify HTTP test success
      ansible.builtin.assert:
        that:
          - http_test.status == 200
