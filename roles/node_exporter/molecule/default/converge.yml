---
- name: Converge
  hosts: all
  tasks:
    - name: "Include hifra01.utils.node_exporter"
      ansible.builtin.include_role:
        name: "hifra01.utils.node_exporter"
      vars:
        node_exporter_web_listen_address: "0.0.0.0:9100"
        node_exporter_enabled_collectors:
          - processes
          - filesystem:
              mount-points-exclude: "^/(sys|proc|dev|host|etc)($|/)"
        node_exporter_disabled_collectors:
          - arp
        node_exporter_extra_flags:
          - "--log.level=info"
        node_exporter_web_config:
          basic_auth_users:
            prometheus: "$2b$12$xZ7zEaVjOgF6mGHmDSMcRuMz5Zvp2o4ysMEau1sCcfzgI.r4Ktsd6"
