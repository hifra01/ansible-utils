---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    linux_users_catalog:
      testuser:
        username: testuser
        sudo: true
        ssh_public_keys:
          - "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQDc9bX7L5G3Mh7Q/S9PzV+z9wQ== testuser@molecule"
    linux_users_selected:
      - testuser
  tasks:
    - name: Include linux_users
      ansible.builtin.include_role:
        name: linux_users
