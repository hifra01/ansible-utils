---
# tasks file for apt_mirror

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Debian', 'Ubuntu']
    fail_msg: 'This role currently supports Debian and Ubuntu only.'

- name: Set repository format fact
  ansible.builtin.set_fact:
    apt_mirror_use_deb822: >-
      {{
        (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('24.04', '>='))
        or
        (ansible_distribution == 'Debian' and ansible_distribution_version is version('12', '>='))
      }}

- name: Ensure python3-debian is installed for DEB822 support
  ansible.builtin.package:
    name: python3-debian
    state: present
  when: apt_mirror_use_deb822

- name: Ensure python3-apt is installed for legacy apt support
  ansible.builtin.package:
    name: python3-apt
    state: present
  when: not apt_mirror_use_deb822

- name: Configure main archive mirror (DEB822)
  ansible.builtin.deb822_repository:
    name: "{{ apt_mirror_deb822_name_main }}"
    state: "{{ 'present' if apt_mirror_enabled else 'absent' }}"
    enabled: true
    types: "{{ apt_mirror_types }}"
    uris:
      - "{{ apt_mirror_main_uri }}"
    suites: "{{ apt_mirror_main_suites }}"
    components: "{{ apt_mirror_components }}"
    signed_by: "{{ apt_mirror_signed_by }}"
  when: apt_mirror_use_deb822
  notify: Update apt cache

- name: Configure security archive mirror (DEB822)
  ansible.builtin.deb822_repository:
    name: "{{ apt_mirror_deb822_name_security }}"
    state: "{{ 'present' if apt_mirror_enabled else 'absent' }}"
    enabled: true
    types: "{{ apt_mirror_types }}"
    uris:
      - "{{ apt_mirror_security_uri }}"
    suites: "{{ apt_mirror_security_suites }}"
    components: "{{ apt_mirror_components }}"
    signed_by: "{{ apt_mirror_signed_by }}"
  when: apt_mirror_use_deb822
  notify: Update apt cache

- name: Configure main archive mirror (Legacy)
  ansible.builtin.apt_repository:
    repo: >-
      deb {{ apt_mirror_main_uri }}
      {{ item }}
      {{ apt_mirror_components | join(' ') }}
    filename: "{{ apt_mirror_legacy_filename_main }}"
    state: "{{ 'present' if apt_mirror_enabled else 'absent' }}"
    update_cache: false
  loop: "{{ apt_mirror_main_suites }}"
  when: not apt_mirror_use_deb822
  notify: Update apt cache

- name: Configure security archive mirror (Legacy)
  ansible.builtin.apt_repository:
    repo: >-
      deb {{ apt_mirror_security_uri }}
      {{ item }}
      {{ apt_mirror_components | join(' ') }}
    filename: "{{ apt_mirror_legacy_filename_security }}"
    state: "{{ 'present' if apt_mirror_enabled else 'absent' }}"
    update_cache: false
  loop: "{{ apt_mirror_security_suites }}"
  when: not apt_mirror_use_deb822
  notify: Update apt cache

- name: Remove legacy .list mirror files when using DEB822
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}.list"
    state: absent
  loop:
    - "{{ apt_mirror_legacy_filename_main }}"
    - "{{ apt_mirror_legacy_filename_security }}"
  when:
    - apt_mirror_use_deb822
    - apt_mirror_cleanup_legacy_files | bool
  notify: Update apt cache

- name: Remove DEB822 .sources mirror files when using Legacy
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
    state: absent
  loop:
    - "{{ apt_mirror_deb822_name_main }}"
    - "{{ apt_mirror_deb822_name_security }}"
  when:
    - not apt_mirror_use_deb822
    - apt_mirror_cleanup_legacy_files | bool
  notify: Update apt cache
