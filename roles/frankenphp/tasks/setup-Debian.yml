---
# tasks file for frankenphp repository setup on Debian/Ubuntu

- name: Install prerequisite packages for repository setup
  ansible.builtin.apt:
    name: "{{ frankenphp_pre_packages }}"
    state: present
    update_cache: true

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download static-php repository signing key
  ansible.builtin.get_url:
    url: "{{ frankenphp_apt_key_url }}"
    dest: "{{ frankenphp_apt_key_path }}"
    mode: '0644'

- name: Add static-php apt repository
  ansible.builtin.apt_repository:
    repo: "{{ frankenphp_apt_repo }}"
    state: present
    filename: "{{ frankenphp_apt_repo_filename }}"
    update_cache: true
