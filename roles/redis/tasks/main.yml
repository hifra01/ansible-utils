---
# tasks file for redis

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "This role only supports Debian and RedHat family systems."

- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - redis_port is integer
      - redis_port >= 1 and redis_port <= 65535
      - redis_databases is integer
      - redis_databases >= 1
      - redis_package_state in ['present', 'latest', 'absent']
      - redis_service_state in ['started', 'stopped', 'restarted', 'reloaded']
      - redis_dir is match('^/')
      - redis_save is sequence
    fail_msg: >-
      Invalid redis_* role variables: port must be an integer between 1 and 65535,
      databases must be >= 1, dir must be an absolute path, and save must be a list.

- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Configure host kernel sysctl parameters
  ansible.builtin.include_tasks: sysctl.yml
  when: redis_sysctl | bool

- name: Install Redis package and create directories
  ansible.builtin.include_tasks: install.yml

- name: Configure Redis service and configuration file
  ansible.builtin.include_tasks: configure.yml
