---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: instance
    image: ${MOLECULE_DISTRO:-geerlingguy/docker-ubuntu2404-ansible}
    platform: linux/amd64
    command: ${MOLECULE_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      become_method: su
  env:
    ANSIBLE_COLLECTIONS_PATH: "/Users/hill/.t3/worktrees/utils/t3-555f5bda/.ansible_collections_isolated:~/.ansible/collections:/usr/share/ansible/collections"
  inventory:
    host_vars:
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
verifier:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: "/Users/hill/.t3/worktrees/utils/t3-555f5bda/.ansible_collections_isolated:~/.ansible/collections:/usr/share/ansible/collections"
