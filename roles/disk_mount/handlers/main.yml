---
# handlers file for disk_mount

- name: Reload systemd daemon after fstab changes
  listen: "reload systemd daemon"
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - ansible_facts['service_mgr'] | default('') == 'systemd'
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'containerd', 'podman', 'container']
