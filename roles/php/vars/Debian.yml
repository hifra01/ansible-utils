---
# vars file for php (Debian family)

php_pre_packages:
  - apt-transport-https
  - ca-certificates
  - gnupg2
  - software-properties-common

php_package_pattern: "phpversion"
php_fpm_package_pattern: "phpversion-fpm"
php_extension_package_pattern: "phpversion-extension"
php_fpm_service_pattern: "phpversion-fpm"
