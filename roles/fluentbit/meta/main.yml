---
galaxy_info:
  author: Hilman F. Rakhmad
  description: Ansible role to install and configure Fluent Bit log collector with Laravel multiline, Nginx access/error, and Graylog/Loki support.
  company: hifra.dev
  license: MIT
  min_ansible_version: "2.21.0"

  platforms:
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: EL
      versions:
        - "8"
        - "9"

  galaxy_tags:
    - fluentbit
    - logging
    - logforwarder
    - graylog
    - loki
    - laravel
    - nginx

dependencies: []
