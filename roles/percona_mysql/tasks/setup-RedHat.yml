---
# tasks file for percona_mysql repository setup on RedHat family

- name: Install prerequisite packages for RedHat repository setup
  ansible.builtin.dnf:
    name: "{{ percona_mysql_prerequisite_packages }}"
    state: present

- name: Check if percona-release is installed
  ansible.builtin.stat:
    path: /usr/bin/percona-release
  register: _percona_mysql_release_stat

- name: Install percona-release repository package on RedHat
  ansible.builtin.dnf:
    name: "{{ percona_mysql_yum_release_rpm_url }}"
    state: present
    disable_gpg_check: true
  when: not _percona_mysql_release_stat.stat.exists

- name: Check if DNF mysql module stream is disabled
  ansible.builtin.stat:
    path: /etc/dnf/modules.d/mysql.module
  register: _percona_mysql_dnf_module_stat
  when: ansible_facts['distribution_major_version'] | int < 10

- name: Disable default DNF mysql module stream
  ansible.builtin.command:
    cmd: dnf -y module disable mysql
  when:
    - ansible_facts['distribution_major_version'] | int < 10
    - not _percona_mysql_dnf_module_stat.stat.exists
  changed_when: true

- name: Check if target Percona YUM/DNF repository is configured
  ansible.builtin.stat:
    path: "/etc/yum.repos.d/percona-{{ percona_mysql_repo_product }}-release.repo"
  register: _percona_mysql_yum_repo_stat

- name: Enable Percona Server repository on RedHat
  ansible.builtin.command:
    cmd: "percona-release enable-only {{ percona_mysql_repo_product }} release"
  when: not _percona_mysql_yum_repo_stat.stat.exists
  changed_when: true
